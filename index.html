<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Touch Test</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;position:fixed;inset:0}
  canvas{position:absolute;left:0;top:0;display:block;touch-action:none}
  #grid{
    position:absolute;inset:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.30) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.30) 1px,transparent 1px),
      linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);
    background-size:250px 250px,250px 250px,50px 50px,50px 50px;
    box-shadow:inset 0 0 0 2px rgba(0,229,255,.85);
  }
  #hud{
    position:fixed;top:calc(6px + env(safe-area-inset-top,0px));left:calc(6px + env(safe-area-inset-left,0px));
    z-index:5;pointer-events:none;color:#7CFF7C;font:600 12px/1.45 monospace;
    background:rgba(0,0,0,.55);padding:5px 8px;border-radius:6px;white-space:pre
  }
  #clear{
    position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:calc(6px + env(safe-area-inset-right,0px));
    z-index:10;touch-action:manipulation;
    background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.55);
    border-radius:8px;padding:9px 14px;font:700 12px sans-serif;letter-spacing:.5px
  }
  #clear:active{background:rgba(255,255,255,.35)}
</style>
</head>
<body>
<canvas id="trail"></canvas>
<div id="grid"></div>
<canvas id="over"></canvas>
<div id="hud"></div>
<button id="clear" type="button">BERSIHKAN</button>

<script>
(function () {
  'use strict';

  var trail = document.getElementById('trail');
  var over  = document.getElementById('over');
  var hud   = document.getElementById('hud');
  var tc = trail.getContext('2d');
  var oc = over.getContext('2d');

  var COLORS = ['#ff2d55','#00e5ff','#76ff03','#ffea00','#e040fb',
                '#ff9100','#2979ff','#1de9b6','#ff80ab','#ffffff'];
  var TRAIL_W = 48;   // tebal jejak (px)
  var DOT_R   = 35;   // radius lingkaran (diameter 70px)
  var GAP     = 40;   // loncatan > ini tidak disambung -> jejak terputus

  var W = 0, H = 0, DPR = 1;
  var pointers = new Map();
  var lastX = null, lastY = null, maxFingers = 0;
  var dirty = true, fsTried = false;

  function resize() {
    var snap = null;
    if (trail.width > 0 && trail.height > 0) {
      snap = document.createElement('canvas');
      snap.width = trail.width;
      snap.height = trail.height;
      snap.getContext('2d').drawImage(trail, 0, 0);
    }
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    [trail, over].forEach(function (c) {
      c.width = Math.round(W * DPR);
      c.height = Math.round(H * DPR);
      c.style.width = W + 'px';
      c.style.height = H + 'px';
    });
    tc.setTransform(DPR, 0, 0, DPR, 0, 0);
    tc.lineCap = 'round';
    tc.lineJoin = 'round';
    tc.lineWidth = TRAIL_W;
    oc.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (snap) {
      tc.save();
      tc.setTransform(1, 0, 0, 1, 0, 0);
      tc.drawImage(snap, 0, 0);
      tc.restore();
    }
    dirty = true;
  }

  function pickColor() {
    var used = {};
    pointers.forEach(function (p) { used[p.ci] = true; });
    for (var i = 0; i < COLORS.length; i++) if (!used[i]) return i;
    return 0;
  }

  function dot(x, y, color) {
    tc.fillStyle = color;
    tc.beginPath();
    tc.arc(x, y, TRAIL_W / 2, 0, Math.PI * 2);
    tc.fill();
  }

  function segment(p, x, y) {
    var dx = x - p.x, dy = y - p.y;
    if (dx === 0 && dy === 0) return;
    if (dx * dx + dy * dy <= GAP * GAP) {
      tc.strokeStyle = p.color;
      tc.beginPath();
      tc.moveTo(p.x, p.y);
      tc.lineTo(x, y);
      tc.stroke();
    } else {
      dot(x, y, p.color); // loncatan besar: jejak sengaja terputus
    }
    p.x = x;
    p.y = y;
  }

  function onDown(e) {
    e.preventDefault();
    try { over.setPointerCapture(e.pointerId); } catch (err) {}
    if (!fsTried) {
      fsTried = true;
      var el = document.documentElement;
      try {
        var r = el.requestFullscreen && el.requestFullscreen({ navigationUI: 'hide' });
        if (r && r.catch) r.catch(function () {});
      } catch (err) {}
    }
    var ci = pickColor();
    var p = { x: e.clientX, y: e.clientY, ci: ci, color: COLORS[ci] };
    pointers.set(e.pointerId, p);
    dot(p.x, p.y, p.color);
    lastX = e.clientX;
    lastY = e.clientY;
    if (pointers.size > maxFingers) maxFingers = pointers.size;
    dirty = true;
  }

  function onMove(e) {
    var p = pointers.get(e.pointerId);
    if (!p) return;
    e.preventDefault();
    var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    if (evs && evs.length) {
      for (var i = 0; i < evs.length; i++) segment(p, evs[i].clientX, evs[i].clientY);
    } else {
      segment(p, e.clientX, e.clientY);
    }
    lastX = e.clientX;
    lastY = e.clientY;
    dirty = true;
  }

  function onEnd(e) {
    if (pointers.delete(e.pointerId)) {
      dirty = true;
    }
  }

  function clearAll() {
    tc.save();
    tc.setTransform(1, 0, 0, 1, 0, 0);
    tc.clearRect(0, 0, trail.width, trail.height);
    tc.restore();
    lastX = lastY = null;
    maxFingers = pointers.size;
    dirty = true;
  }

  function draw() {
    oc.clearRect(0, 0, W, H);
    pointers.forEach(function (p) {
      oc.save();
      oc.shadowColor = p.color;
      oc.shadowBlur = 40;
      oc.fillStyle = p.color;
      oc.beginPath();
      oc.arc(p.x, p.y, DOT_R, 0, Math.PI * 2);
      oc.fill();
      oc.shadowBlur = 0;
      oc.lineWidth = 4;
      oc.strokeStyle = '#fff';
      oc.stroke();
      oc.fillStyle = '#000';
      oc.font = 'bold 22px sans-serif';
      oc.textAlign = 'center';
      oc.textBaseline = 'middle';
      oc.fillText(String(p.ci + 1), p.x, p.y + 1);
      oc.restore();
    });
    hud.textContent =
      'Jari aktif : ' + pointers.size + '  (maks ' + maxFingers + ')\n' +
      'X: ' + (lastX === null ? '-' : Math.round(lastX)) +
      '  Y: ' + (lastY === null ? '-' : Math.round(lastY)) +
      '\nLayar: ' + W + '×' + H;
  }

  function loop() {
    if (dirty) { dirty = false; draw(); }
    requestAnimationFrame(loop);
  }

  over.addEventListener('pointerdown', onDown, { passive: false });
  over.addEventListener('pointermove', onMove, { passive: false });
  over.addEventListener('pointerup', onEnd);
  over.addEventListener('pointercancel', onEnd);
  over.addEventListener('lostpointercapture', onEnd);

  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  document.getElementById('clear').addEventListener('click', clearAll);
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });

  resize();
  loop();
})();
</script>
</body>
</html>
